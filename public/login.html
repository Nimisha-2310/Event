<!DOCTYPE html>
<html>
<head>
<title>Login - EventConnect</title>

<style>

body{
margin:0;
font-family:Arial, sans-serif;
background:#f4f4f4;
color:#333;
}

/* NAVBAR */

.navbar{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 40px;
background:#333;
color:white;
}

.logo{
font-size:20px;
font-weight:bold;
}

.navlinks a{
color:white;
text-decoration:none;
margin-left:20px;
font-size:14px;
}

.navlinks a:hover{
text-decoration:underline;
}

/* LOGIN SECTION */

.login-container{
display:flex;
justify-content:center;
align-items:center;
height:80vh;
}

.login-box{
background:white;
padding:30px;
border:1px solid #ccc;
width:300px;
text-align:center;
}

.login-box h2{
margin-bottom:20px;
}

/* INPUT */

.login-box input{
width:100%;
padding:8px;
margin:8px 0;
border:1px solid #ccc;
}

/* BUTTON */

.login-box button{
width:100%;
padding:8px;
background:#333;
border:none;
color:white;
cursor:pointer;
margin-top:10px;
}

.login-box button:hover{
background:#555;
}

/* TEXT */

.login-box p{
margin-top:15px;
font-size:14px;
}

.login-box a{
color:#333;
}

/* FOOTER */

footer{
text-align:center;
padding:15px;
background:#333;
color:white;
}

</style>
</head>

<body>

<!-- HEADER -->

<div class="navbar">

<div class="logo">EventConnect</div>

<div class="navlinks">
<a href="./index.html">Home</a>
<a href="./event.html">Events</a>
<a href="./login.html">Login</a>
<a href="./signup.html">Signup</a>
</div>

</div>

<!-- LOGIN FORM -->

<div class="login-container">

<div class="login-box">

<h2>Login</h2>

<form action="/login" method="POST">

<input type="email" name="email" placeholder="Enter Email" required>

<input type="password" name="password" placeholder="Enter Password" required>

<button type="submit">Login</button>

</form>

<p>Don't have an account? <a href="signup.html">Signup</a></p>

</div>

</div>

<footer>
© 2026 EventConnect
</footer>

</body>
</html>
