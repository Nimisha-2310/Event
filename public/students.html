<!DOCTYPE html>
<html>
<head>
<title>Manage Students - Task 10</title>
<style>
body{ font-family:Arial; background:#f4f4f4; padding:20px; }
.container{ max-width:800px; margin:auto; background:white; padding:20px; border:1px solid #ccc; }
h2{ text-align:center; }
form{ display:flex; flex-direction:column; gap:10px; margin-bottom:20px;}
input{ padding:8px; border:1px solid #ccc; }
button{ padding:10px; background:#333; color:white; border:none; cursor:pointer;}
table{ width:100%; border-collapse:collapse; margin-top:20px; }
th, td{ padding:10px; border:1px solid #ccc; text-align:left; }
.actions button{ background:#ff4444; padding:5px 10px; margin-right:5px; }
.actions .edit-btn{ background:#ffbb33; }
</style>
</head>
<body>
<div class="container">
<h2>Manage Students</h2>
<a href="/">Go Home</a>
<hr>

<!-- Create / Update Form -->
<form id="studentForm">
    <input type="hidden" id="studentId" name="id">
    <input type="text" id="name" name="name" placeholder="Student Name" required>
    <input type="email" id="email" name="email" placeholder="Student Email" required>
    <input type="number" id="age" name="age" placeholder="Age" required>
    <input type="text" id="course" name="course" placeholder="Course" required>
    <button type="submit" id="submitBtn">Add Student</button>
</form>

<!-- Students List -->
<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Age</th>
            <th>Course</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody id="studentsTableBody">
        <!-- Records injected here -->
    </tbody>
</table>

</div>

<script>
    const form = document.getElementById('studentForm');
    const tbody = document.getElementById('studentsTableBody');

    // Fetch and display
    function loadStudents() {
        fetch('/api/students')
            .then(res => res.json())
            .then(data => {
                tbody.innerHTML = '';
                data.forEach(student => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${student.id}</td>
                            <td>${student.name}</td>
                            <td>${student.email}</td>
                            <td>${student.age}</td>
                            <td>${student.course}</td>
                            <td class="actions">
                                <button class="edit-btn" onclick="editStudent(${student.id}, '${student.name}', '${student.email}', ${student.age}, '${student.course}')">Edit</button>
                                <button onclick="deleteStudent(${student.id})">Delete</button>
                            </td>
                        </tr>
                    `;
                });
            });
    }

    // Submit form (Create or Update)
    form.addEventListener('submit', (e) => {
        e.preventDefault();
        const id = document.getElementById('studentId').value;
        const payload = {
            name: document.getElementById('name').value,
            email: document.getElementById('email').value,
            age: document.getElementById('age').value,
            course: document.getElementById('course').value
        };

        const method = id ? 'PUT' : 'POST';
        const url = id ? `/api/students/${id}` : '/api/students';

        fetch(url, {
            method: method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        }).then(res => res.json()).then(() => {
            form.reset();
            document.getElementById('studentId').value = '';
            document.getElementById('submitBtn').innerText = 'Add Student';
            loadStudents();
        });
    });

    function editStudent(id, name, email, age, course) {
        document.getElementById('studentId').value = id;
        document.getElementById('name').value = name;
        document.getElementById('email').value = email;
        document.getElementById('age').value = age;
        document.getElementById('course').value = course;
        document.getElementById('submitBtn').innerText = 'Update Student';
    }

    function deleteStudent(id) {
        if(confirm('Are you sure you want to delete this student?')) {
            fetch(`/api/students/${id}`, { method: 'DELETE' })
                .then(res => res.json())
                .then(() => loadStudents());
        }
    }

    loadStudents();
</script>
</body>
</html>
