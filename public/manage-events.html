<!DOCTYPE html>
<html>
<head>
<title>Manage Events - Task 11</title>
<style>
body{ font-family:Arial; background:#f4f4f4; padding:20px; }
.container{ max-width:800px; margin:auto; background:white; padding:20px; border:1px solid #ccc; }
h2{ text-align:center; }
form{ display:flex; flex-direction:column; gap:10px; margin-bottom:20px;}
input, textarea{ padding:8px; border:1px solid #ccc; }
button{ padding:10px; background:#333; color:white; border:none; cursor:pointer;}
table{ width:100%; border-collapse:collapse; margin-top:20px; }
th, td{ padding:10px; border:1px solid #ccc; text-align:left; }
.actions button{ background:#ff4444; padding:5px 10px; margin-right:5px; }
.actions .edit-btn{ background:#ffbb33; }
</style>
</head>
<body>
<div class="container">
<h2>Manage Events</h2>
<a href="/">Go Home</a>
<hr>

<!-- Create / Update Form -->
<form id="eventForm">
    <input type="hidden" id="eventId" name="id">
    <input type="text" id="event_name" name="event_name" placeholder="Event Name" required>
    <input type="date" id="event_date" name="event_date" required>
    <input type="text" id="location" name="location" placeholder="Location" required>
    <textarea id="description" name="description" placeholder="Description"></textarea>
    <button type="submit" id="submitBtn">Add Event</button>
</form>

<!-- Events List -->
<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Date</th>
            <th>Location</th>
            <th>Description</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody id="eventsTableBody">
        <!-- Records injected here -->
    </tbody>
</table>

</div>

<script>
    const form = document.getElementById('eventForm');
    const tbody = document.getElementById('eventsTableBody');

    function loadEvents() {
        fetch('/api/events')
            .then(res => res.json())
            .then(data => {
                tbody.innerHTML = '';
                data.forEach(event => {
                    // Extract date string YYYY-MM-DD
                    const dateStr = new Date(event.event_date).toISOString().split('T')[0];
                    tbody.innerHTML += `
                        <tr>
                            <td>${event.id}</td>
                            <td>${event.event_name}</td>
                            <td>${dateStr}</td>
                            <td>${event.location}</td>
                            <td>${event.description}</td>
                            <td class="actions">
                                <button class="edit-btn" onclick="editEvent(${event.id}, '${event.event_name}', '${dateStr}', '${event.location}', '${(event.description || '').replace(/'/g, "\\'")}')">Edit</button>
                                <button onclick="deleteEvent(${event.id})">Delete</button>
                            </td>
                        </tr>
                    `;
                });
            });
    }

    form.addEventListener('submit', (e) => {
        e.preventDefault();
        const id = document.getElementById('eventId').value;
        const payload = {
            event_name: document.getElementById('event_name').value,
            event_date: document.getElementById('event_date').value,
            location: document.getElementById('location').value,
            description: document.getElementById('description').value
        };

        const method = id ? 'PUT' : 'POST';
        const url = id ? `/api/events/${id}` : '/api/events';

        fetch(url, {
            method: method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        }).then(res => res.json()).then(() => {
            form.reset();
            document.getElementById('eventId').value = '';
            document.getElementById('submitBtn').innerText = 'Add Event';
            loadEvents();
        });
    });

    function editEvent(id, name, date, location, desc) {
        document.getElementById('eventId').value = id;
        document.getElementById('event_name').value = name;
        document.getElementById('event_date').value = date;
        document.getElementById('location').value = location;
        document.getElementById('description').value = desc;
        document.getElementById('submitBtn').innerText = 'Update Event';
    }

    function deleteEvent(id) {
        if(confirm('Are you sure you want to delete this event?')) {
            fetch(`/api/events/${id}`, { method: 'DELETE' })
                .then(res => res.json())
                .then(() => loadEvents());
        }
    }

    loadEvents();
</script>
</body>
</html>
